<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" width="100%" height="100%">
  <defs>
    <!-- Background Gradient for Window -->
    <linearGradient id="winDarkBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#202020"/>
      <stop offset="100%" stop-color="#181818"/>
    </linearGradient>
    <linearGradient id="graphFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0078d4" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#0078d4" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="headerGrad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1f2937"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <filter id="winShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <style>
    .segoe { font-family: 'Segoe UI Variable Text', 'Segoe UI', Tahoma, sans-serif; }
    .farsi { font-family: 'Vazirmatn', -apple-system, sans-serif; }
  </style>

  <!-- Outer canvas background -->
  <rect width="640" height="460" rx="16" fill="#0d1117"/>

  <!-- Top Consultation Badge Banner -->
  <g transform="translate(145, 10)">
    <rect x="0" y="0" width="350" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="175" y="19" class="farsi" font-size="12" font-weight="700" fill="#38bdf8" text-anchor="middle">🔍 بررسی دقیق مشخصات فنی و تست در Task Manager</text>
  </g>

  <!-- Windows 11 Task Manager Window Frame -->
  <g transform="translate(15, 45)" filter="url(#winShadow)">
    <!-- Main Window Background with Rounded Corners -->
    <rect width="610" height="400" rx="10" fill="url(#winDarkBg)" stroke="#383838" stroke-width="1"/>

    <!-- ================= Titlebar ================= -->
    <path d="M 0 10 Q 0 0 10 0 L 600 0 Q 610 0 610 10 L 610 38 L 0 38 Z" fill="#202020"/>
    <!-- Task Manager Icon -->
    <g transform="translate(14, 10)">
      <rect x="0" y="0" width="18" height="18" rx="3" fill="#0078d4"/>
      <polyline points="2,12 6,12 8,5 11,15 13,9 16,9" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <!-- Window Title -->
    <text x="40" y="23" class="segoe" font-size="12" font-weight="600" fill="#ffffff">Task Manager</text>

    <!-- Search box in titlebar -->
    <rect x="180" y="6" width="220" height="24" rx="4" fill="#2d2d2d" stroke="#3d3d3d" stroke-width="1"/>
    <circle cx="192" cy="18" r="4" fill="none" stroke="#8a8a8a" stroke-width="1.2"/>
    <line x1="195" y1="21" x2="199" y2="25" stroke="#8a8a8a" stroke-width="1.2"/>
    <text x="206" y="22" class="segoe" font-size="10" fill="#8a8a8a">Type a name, publisher, or PID to search</text>

    <!-- Window Control Buttons (Minimize, Maximize, Close) -->
    <g transform="translate(540, 0)">
      <rect x="0" y="0" width="22" height="28" fill="transparent"/>
      <line x1="6" y1="14" x2="16" y2="14" stroke="#cccccc" stroke-width="1.2"/>
      <rect x="23" y="8" width="11" height="11" fill="none" stroke="#cccccc" stroke-width="1.2"/>
      <!-- Close button -->
      <g transform="translate(45, 0)">
        <line x1="5" y1="9" x2="15" y2="19" stroke="#cccccc" stroke-width="1.2"/>
        <line x1="15" y1="9" x2="5" y2="19" stroke="#cccccc" stroke-width="1.2"/>
      </g>
    </g>

    <line x1="0" y1="38" x2="610" y2="38" stroke="#2d2d2d" stroke-width="1"/>

    <!-- ================= Left Navigation Rail ================= -->
    <rect x="0" y="38" width="48" height="362" fill="#1c1c1c"/>
    <!-- Hamburger Menu Icon -->
    <g transform="translate(14, 50)" stroke="#cccccc" stroke-width="1.5">
      <line x1="0" y1="0" x2="18" y2="0"/>
      <line x1="0" y1="6" x2="18" y2="6"/>
      <line x1="0" y1="12" x2="18" y2="12"/>
    </g>
    <!-- Processes Icon -->
    <rect x="15" y="80" width="16" height="14" rx="2" fill="none" stroke="#999999" stroke-width="1.5"/>
    <!-- Performance Icon (Selected) -->
    <rect x="0" y="105" width="48" height="36" fill="#292929"/>
    <rect x="0" y="113" width="3" height="20" rx="1.5" fill="#0078d4"/>
    <g transform="translate(14, 115)">
      <polyline points="0,12 4,12 7,3 11,15 14,7 18,7" fill="none" stroke="#0078d4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <!-- App History -->
    <circle cx="23" cy="162" r="7" fill="none" stroke="#999999" stroke-width="1.5"/>
    <!-- Startup Apps -->
    <path d="M 16 195 L 30 195 L 30 205 L 16 205 Z" fill="none" stroke="#999999" stroke-width="1.5"/>
    <line x1="48" y1="38" x2="48" y2="400" stroke="#2d2d2d" stroke-width="1"/>

    <!-- ================= Performance Sidebar Items (Left of Main Pane) ================= -->
    <rect x="48" y="38" width="162" height="362" fill="#181818"/>
    
    <!-- Item 1: CPU (Active) -->
    <g transform="translate(52, 45)">
      <rect x="0" y="0" width="154" height="52" rx="4" fill="#282828" stroke="#0078d4" stroke-width="1"/>
      <text x="10" y="18" class="segoe" font-size="11" font-weight="700" fill="#ffffff">CPU</text>
      <text x="10" y="32" class="segoe" font-size="10" fill="#0078d4">18%  3.42 GHz</text>
      <text x="10" y="44" class="segoe" font-size="8" fill="#888888">i7-13700H</text>
      <!-- Mini graph -->
      <path d="M 100 40 L 110 32 L 120 38 L 130 25 L 140 30 L 148 20" fill="none" stroke="#0078d4" stroke-width="1.5"/>
    </g>

    <!-- Item 2: Memory (RAM) -->
    <g transform="translate(52, 102)">
      <rect x="0" y="0" width="154" height="48" rx="4" fill="#1f1f1f"/>
      <text x="10" y="16" class="segoe" font-size="11" font-weight="700" fill="#ffffff">Memory</text>
      <text x="10" y="30" class="segoe" font-size="10" fill="#a5b4fc">12.4 / 32.0 GB (39%)</text>
      <text x="10" y="42" class="segoe" font-size="8" fill="#888888">DDR5 5200 MT/s</text>
      <!-- Mini bar -->
      <rect x="100" y="24" width="45" height="6" rx="2" fill="#333333"/>
      <rect x="100" y="24" width="18" height="6" rx="2" fill="#818cf8"/>
    </g>

    <!-- Item 3: Disk (Storage SSD) -->
    <g transform="translate(52, 155)">
      <rect x="0" y="0" width="154" height="48" rx="4" fill="#1f1f1f"/>
      <text x="10" y="16" class="segoe" font-size="11" font-weight="700" fill="#ffffff">Disk 0 (C:)</text>
      <text x="10" y="30" class="segoe" font-size="10" fill="#34d399">NVMe 1TB SSD (2%)</text>
      <text x="10" y="42" class="segoe" font-size="8" fill="#888888">Samsung 980 PRO</text>
      <path d="M 100 38 L 115 38 L 122 26 L 130 38 L 148 38" fill="none" stroke="#10b981" stroke-width="1.5"/>
    </g>

    <!-- Item 4: GPU 1 (Dedicated Graphics) -->
    <g transform="translate(52, 208)">
      <rect x="0" y="0" width="154" height="52" rx="4" fill="#1f1f1f"/>
      <text x="10" y="16" class="segoe" font-size="11" font-weight="700" fill="#ffffff">GPU 1 (NVIDIA)</text>
      <text x="10" y="30" class="segoe" font-size="10" fill="#76b900">RTX 4060 Laptop (15%)</text>
      <text x="10" y="44" class="segoe" font-size="8" fill="#888888">8 GB GDDR6 • 48°C</text>
      <path d="M 100 40 L 115 36 L 125 40 L 135 30 L 148 34" fill="none" stroke="#76b900" stroke-width="1.5"/>
    </g>

    <!-- Item 5: Wi-Fi -->
    <g transform="translate(52, 265)">
      <rect x="0" y="0" width="154" height="44" rx="4" fill="#1f1f1f"/>
      <text x="10" y="16" class="segoe" font-size="11" font-weight="700" fill="#ffffff">Wi-Fi</text>
      <text x="10" y="30" class="segoe" font-size="10" fill="#38bdf8">Wi-Fi 6E (802.11ax)</text>
      <text x="10" y="40" class="segoe" font-size="8" fill="#888888">S: 120 Kbps  R: 1.4 Mbps</text>
    </g>

    <line x1="210" y1="38" x2="210" y2="400" stroke="#2d2d2d" stroke-width="1"/>

    <!-- ================= Main Details Pane (Right) ================= -->
    <g transform="translate(220, 45)">
      <!-- Main Header -->
      <text x="10" y="18" class="segoe" font-size="18" font-weight="700" fill="#ffffff">CPU</text>
      <text x="50" y="17" class="segoe" font-size="13" font-weight="600" fill="#0078d4">Intel(R) Core(TM) i7-13700H</text>

      <text x="10" y="38" class="segoe" font-size="11" fill="#888888">% Utilization over 60 seconds</text>
      <text x="310" y="38" class="segoe" font-size="11" fill="#888888" text-anchor="end">100%</text>

      <!-- Main Live Graph Box -->
      <g transform="translate(10, 45)">
        <rect width="365" height="150" rx="4" fill="#121212" stroke="#333333" stroke-width="1"/>
        
        <!-- Grid lines inside graph -->
        <g stroke="#262626" stroke-width="1">
          <line x1="0" y1="30" x2="365" y2="30"/>
          <line x1="0" y1="60" x2="365" y2="60"/>
          <line x1="0" y1="90" x2="365" y2="90"/>
          <line x1="0" y1="120" x2="365" y2="120"/>
          <line x1="73" y1="0" x2="73" y2="150"/>
          <line x1="146" y1="0" x2="146" y2="150"/>
          <line x1="219" y1="0" x2="219" y2="150"/>
          <line x1="292" y1="0" x2="292" y2="150"/>
        </g>

        <!-- Wave / Area chart -->
        <path d="M 0 150 
                 L 0 125 
                 L 25 110 
                 L 45 130 
                 L 70 95 
                 L 90 115 
                 L 115 75 
                 L 135 105 
                 L 160 80 
                 L 185 120 
                 L 210 60 
                 L 230 85 
                 L 260 40 
                 L 285 70 
                 L 310 95 
                 L 335 55 
                 L 365 72 
                 L 365 150 Z" 
              fill="url(#graphFill)"/>

        <path d="M 0 125 
                 L 25 110 
                 L 45 130 
                 L 70 95 
                 L 90 115 
                 L 115 75 
                 L 135 105 
                 L 160 80 
                 L 185 120 
                 L 210 60 
                 L 230 85 
                 L 260 40 
                 L 285 70 
                 L 310 95 
                 L 335 55 
                 L 365 72" 
              fill="none" stroke="#0078d4" stroke-width="2" stroke-linecap="round"/>
        
        <!-- Live marker -->
        <circle cx="365" cy="72" r="4" fill="#0078d4" stroke="#ffffff" stroke-width="1.5"/>
      </g>

      <!-- Key Details & Specs Grid -->
      <g transform="translate(10, 208)">
        <!-- Col 1 -->
        <text x="0" y="14" class="segoe" font-size="10" fill="#888888">Utilization</text>
        <text x="0" y="32" class="segoe" font-size="18" font-weight="700" fill="#ffffff">18%</text>

        <text x="75" y="14" class="segoe" font-size="10" fill="#888888">Speed</text>
        <text x="75" y="32" class="segoe" font-size="18" font-weight="700" fill="#ffffff">3.42 GHz</text>

        <!-- Col 2 Specs table -->
        <g transform="translate(170, 0)">
          <text x="0" y="12" class="segoe" font-size="9" fill="#888888">Base speed:</text>
          <text x="80" y="12" class="segoe" font-size="9" font-weight="600" fill="#dddddd">2.40 GHz</text>

          <text x="0" y="26" class="segoe" font-size="9" fill="#888888">Sockets:</text>
          <text x="80" y="26" class="segoe" font-size="9" font-weight="600" fill="#dddddd">1</text>

          <text x="0" y="40" class="segoe" font-size="9" fill="#888888">Cores / Threads:</text>
          <text x="80" y="40" class="segoe" font-size="9" font-weight="600" fill="#0078d4">14 (6P+8E) / 20</text>
        </g>

        <!-- Col 3 Specs table -->
        <g transform="translate(280, 0)">
          <text x="0" y="12" class="segoe" font-size="9" fill="#888888">L3 Cache:</text>
          <text x="55" y="12" class="segoe" font-size="9" font-weight="600" fill="#dddddd">24.0 MB</text>

          <text x="0" y="26" class="segoe" font-size="9" fill="#888888">RAM Model:</text>
          <text x="55" y="26" class="segoe" font-size="9" font-weight="600" fill="#818cf8">32GB DDR5</text>

          <text x="0" y="40" class="segoe" font-size="9" fill="#888888">GPU Model:</text>
          <text x="55" y="40" class="segoe" font-size="9" font-weight="600" fill="#76b900">RTX 4060 8GB</text>
        </g>
      </g>

      <!-- Bottom Hardware Badge Bar -->
      <g transform="translate(10, 268)">
        <rect width="365" height="72" rx="6" fill="#1f2937" stroke="#374151" stroke-width="1"/>
        <g transform="translate(10, 10)">
          <!-- RAM Badge -->
          <rect x="0" y="2" width="105" height="48" rx="4" fill="#111827"/>
          <text x="8" y="18" class="segoe" font-size="9" font-weight="700" fill="#818cf8">RAM: 32 GB</text>
          <text x="8" y="32" class="segoe" font-size="8" fill="#9ca3af">DDR5 5200 MHz</text>
          <text x="8" y="44" class="segoe" font-size="8" fill="#34d399">Dual Channel 2/2</text>

          <!-- SSD Badge -->
          <rect x="115" y="2" width="110" height="48" rx="4" fill="#111827"/>
          <text x="123" y="18" class="segoe" font-size="9" font-weight="700" fill="#34d399">SSD: 1000 GB</text>
          <text x="123" y="32" class="segoe" font-size="8" fill="#9ca3af">NVMe PCIe 4.0 M.2</text>
          <text x="123" y="44" class="segoe" font-size="8" fill="#38bdf8">Speed: 7000 MB/s</text>

          <!-- GPU Badge -->
          <rect x="235" y="2" width="110" height="48" rx="4" fill="#111827"/>
          <text x="243" y="18" class="segoe" font-size="9" font-weight="700" fill="#76b900">GPU: RTX 4060</text>
          <text x="243" y="32" class="segoe" font-size="8" fill="#9ca3af">8GB GDDR6 (140W)</text>
          <text x="243" y="44" class="segoe" font-size="8" fill="#fbbf24">DirectX 12 Ultimate</text>
        </g>
      </g>
    </g>
  </g>
</svg>
