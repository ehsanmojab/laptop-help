<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 460" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091422"/>
      <stop offset="50%" stop-color="#0f2137"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="floorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="specialistShirt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <linearGradient id="fatherSuit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="daughterManto" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="laptopBagGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <filter id="shadow4" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <style>
    .farsi { font-family: 'Vazirmatn', -apple-system, sans-serif; direction: rtl; }
  </style>

  <!-- Background -->
  <rect width="620" height="460" rx="20" fill="url(#bgGrad4)"/>

  <!-- Office Background Elements -->
  <!-- Floor line -->
  <rect x="0" y="380" width="620" height="80" rx="0" fill="url(#floorGrad)"/>
  <line x1="0" y1="380" x2="620" y2="380" stroke="#334155" stroke-width="1.5"/>

  <!-- Background Wall Art / Health Test Screen -->
  <g transform="translate(180, 50)" filter="url(#shadow4)" opacity="0.85">
    <rect x="0" y="0" width="260" height="110" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
    <!-- Screen Header -->
    <rect x="0" y="0" width="260" height="24" rx="8" fill="#1e293b"/>
    <circle cx="16" cy="12" r="4" fill="#ef4444"/>
    <circle cx="28" cy="12" r="4" fill="#eab308"/>
    <circle cx="40" cy="12" r="4" fill="#10b981"/>
    <text x="130" y="16" class="farsi" font-size="10" fill="#94a3b8" text-anchor="middle">گواهی تست سلامت سخت‌افزار (OK)</text>

    <!-- Test check items -->
    <g transform="translate(15, 36)">
      <text x="230" y="14" class="farsi" font-size="9" fill="#34d399" text-anchor="end">✓ تست باتری و چرخه شارژ: سالم</text>
      <text x="230" y="30" class="farsi" font-size="9" fill="#34d399" text-anchor="end">✓ سلامت هارد دیسک و SSD: ۱۰۰٪</text>
      <text x="230" y="46" class="farsi" font-size="9" fill="#34d399" text-anchor="end">✓ تست صفحه نمایش (بدون پیکسل سوخته)</text>
      <text x="230" y="62" class="farsi" font-size="9" fill="#34d399" text-anchor="end">✓ تست استرس CPU و کارت گرافیک</text>
    </g>

    <!-- Stamp of Approval -->
    <g transform="translate(25, 45)">
      <circle cx="25" cy="25" r="22" fill="#059669" opacity="0.2" stroke="#10b981" stroke-width="1.5" stroke-dasharray="3,2"/>
      <text x="25" y="24" class="farsi" font-size="8" font-weight="900" fill="#34d399" text-anchor="middle">تأیید سلامت</text>
      <text x="25" y="34" font-size="8" font-weight="900" fill="#34d399" text-anchor="middle">PASSED</text>
    </g>
  </g>

  <!-- Top Title Banner -->
  <g transform="translate(150, 12)">
    <rect x="0" y="0" width="320" height="28" rx="14" fill="#1e293b" stroke="#10b981" stroke-width="1.2"/>
    <text x="160" y="19" class="farsi" font-size="12" font-weight="700" fill="#34d399" text-anchor="middle">🤝 همراهی در خرید و تحویل با تست سلامت کامل</text>
  </g>

  <!-- ==============================================================
       CHARACTER 1: THE SPECIALIST (متخصص با تی‌شرت سبز) on LEFT
       ============================================================== -->
  <g id="specialist" transform="translate(80, 160)">
    <!-- Shadow under feet -->
    <ellipse cx="65" cy="225" rx="35" ry="8" fill="#000000" opacity="0.4"/>

    <!-- Shoes -->
    <rect x="42" y="365" width="22" height="12" rx="5" fill="#1e293b"/>
    <rect x="72" y="365" width="22" height="12" rx="5" fill="#1e293b"/>

    <!-- Jeans / Trousers -->
    <path d="M 46 295 L 42 368 L 62 368 L 65 305 L 68 305 L 72 368 L 92 368 L 88 295 Z" fill="#334155"/>

    <!-- Green T-Shirt Body -->
    <path d="M 38 185 L 32 230 L 46 230 L 46 298 L 86 298 L 86 230 L 100 230 L 94 185 Q 66 182 38 185 Z" fill="url(#specialistShirt)"/>
    <!-- T-shirt collar -->
    <path d="M 54 185 Q 66 198 78 185" fill="none" stroke="#166534" stroke-width="2.5"/>

    <!-- Head & Face -->
    <!-- Neck -->
    <rect x="58" y="165" width="16" height="22" rx="3" fill="#fbd5b5"/>
    <!-- Face -->
    <circle cx="66" cy="145" r="22" fill="#fed7aa"/>
    <!-- Hair -->
    <path d="M 44 140 Q 66 115 88 135 Q 86 120 66 120 Q 48 122 44 140 Z" fill="#292524"/>
    <!-- Friendly Face details -->
    <!-- Eyes -->
    <circle cx="73" cy="144" r="2" fill="#1c1917"/>
    <!-- Smile -->
    <path d="M 68 154 Q 74 158 78 153" fill="none" stroke="#9a3412" stroke-width="1.8" stroke-linecap="round"/>
    <!-- Glasses -->
    <rect x="68" y="139" width="12" height="9" rx="3" fill="none" stroke="#047857" stroke-width="1.5"/>
    <line x1="64" y1="143" x2="68" y2="143" stroke="#047857" stroke-width="1.5"/>

    <!-- Left Arm (Hand in pocket) -->
    <path d="M 36 190 Q 22 230 38 260" fill="none" stroke="#fed7aa" stroke-width="11" stroke-linecap="round"/>
    <circle cx="38" cy="260" r="6" fill="#fed7aa"/>

    <!-- Right Arm: Extending forward for HANDSHAKE -->
    <path d="M 94 195 Q 120 205 145 220" fill="none" stroke="url(#specialistShirt)" stroke-width="14" stroke-linecap="round"/>
    <path d="M 140 218 L 175 224" fill="none" stroke="#fed7aa" stroke-width="9" stroke-linecap="round"/>
  </g>

  <!-- ==============================================================
       CHARACTER 2: THE FATHER (پدر با کت و شلوار و دکمه باز) in CENTER-RIGHT
       ============================================================== -->
  <g id="father" transform="translate(280, 145)">
    <!-- Shadow under feet -->
    <ellipse cx="65" cy="240" rx="36" ry="9" fill="#000000" opacity="0.4"/>

    <!-- Leather Shoes -->
    <rect x="42" y="380" width="24" height="12" rx="4" fill="#0f172a"/>
    <rect x="70" y="380" width="24" height="12" rx="4" fill="#0f172a"/>

    <!-- Suit Pants -->
    <path d="M 44 290 L 40 382 L 64 382 L 67 305 L 70 305 L 73 382 L 96 382 L 92 290 Z" fill="#1e293b"/>
    <line x1="52" y1="305" x2="52" y2="380" stroke="#334155" stroke-width="1"/>
    <line x1="84" y1="305" x2="84" y2="380" stroke="#334155" stroke-width="1"/>

    <!-- Inside Shirt (White Dress Shirt) showing because jacket is unbuttoned -->
    <polygon points="50,185 86,185 82,290 54,290" fill="#f8fafc"/>
    <!-- Tie -->
    <polygon points="65,190 71,190 73,260 68,270 63,260" fill="#b91c1c"/>
    <polygon points="65,188 71,188 73,195 63,195" fill="#991b1b"/>

    <!-- Open Suit Jacket (کت با دکمه باز) -->
    <!-- Left flap of open suit jacket -->
    <path d="M 34 185 L 18 235 L 30 295 L 52 295 L 48 215 L 56 185 Z" fill="url(#fatherSuit)"/>
    <!-- Right flap of open suit jacket -->
    <path d="M 100 185 L 116 235 L 102 295 L 82 295 L 86 215 L 78 185 Z" fill="url(#fatherSuit)"/>
    <!-- Suit lapels -->
    <polygon points="56,185 46,230 52,230" fill="#475569"/>
    <polygon points="78,185 88,230 82,230" fill="#475569"/>

    <!-- Neck & Head -->
    <rect x="61" y="166" width="14" height="20" rx="3" fill="#fed7aa"/>
    <circle cx="68" cy="146" r="22" fill="#fed7aa"/>
    <!-- Grey/Dark Hair (Father) -->
    <path d="M 47 142 Q 68 118 89 138 Q 87 122 68 122 Q 52 124 47 142 Z" fill="#4b5563"/>
    <path d="M 46 142 Q 44 152 48 156" fill="none" stroke="#4b5563" stroke-width="3"/>
    <!-- Neatly groomed short beard / mustache -->
    <path d="M 62 158 Q 68 162 74 158" fill="none" stroke="#4b5563" stroke-width="2"/>
    <!-- Eyes & Smile -->
    <circle cx="62" cy="144" r="2" fill="#1c1917"/>
    <path d="M 59 153 Q 65 157 70 152" fill="none" stroke="#9a3412" stroke-width="1.8" stroke-linecap="round"/>

    <!-- Father's Left Arm: Extending to HANDSHAKE with Specialist -->
    <path d="M 30 195 Q 5 210 -25 235" fill="none" stroke="url(#fatherSuit)" stroke-width="14" stroke-linecap="round"/>
    <path d="M -20 232 L -45 238" fill="none" stroke="#fed7aa" stroke-width="9" stroke-linecap="round"/>

    <!-- Handshake Connection in Center between Specialist and Father -->
    <g transform="translate(-32, 236)" filter="url(#shadow4)">
      <!-- Hand clasp -->
      <ellipse cx="0" cy="0" rx="10" ry="7" fill="#fbd5b5"/>
      <path d="M -8 -3 Q 0 4 8 -2" fill="none" stroke="#d97706" stroke-width="1.8"/>
      <!-- Mutual trust sparkle -->
      <circle cx="0" cy="-10" r="3" fill="#facc15"/>
      <polygon points="0,-16 2,-11 7,-9 2,-7 0,-2 -2,-7 -7,-9 -2,-11" fill="#facc15"/>
    </g>
  </g>

  <!-- ==============================================================
       CHARACTER 3: THE STUDENT DAUGHTER (دختر دانشجو با مانتو سرمه‌ای، مقنعه مشکی، موی بیرون و کیف لپتاپ) on RIGHT
       ============================================================== -->
  <g id="daughter" transform="translate(440, 160)">
    <!-- Shadow under feet -->
    <ellipse cx="60" cy="225" rx="32" ry="8" fill="#000000" opacity="0.4"/>

    <!-- Student Shoes / Sneakers -->
    <rect x="42" y="365" width="18" height="10" rx="4" fill="#3b82f6"/>
    <rect x="64" y="365" width="18" height="10" rx="4" fill="#3b82f6"/>
    <line x1="42" y1="372" x2="60" y2="372" stroke="#ffffff" stroke-width="1.5"/>
    <line x1="64" y1="372" x2="82" y2="372" stroke="#ffffff" stroke-width="1.5"/>

    <!-- Slim Pants underneath Manto -->
    <rect x="44" y="325" width="14" height="42" fill="#0f172a"/>
    <rect x="66" y="325" width="14" height="42" fill="#0f172a"/>

    <!-- Navy Blue Manto (مانتو سرمه‌ای شیک دانشجویی) -->
    <path d="M 40 180 L 25 240 L 28 335 L 94 335 L 96 240 L 80 180 Z" fill="url(#daughterManto)"/>
    <!-- Manto belt / waistline -->
    <rect x="35" y="242" width="52" height="6" rx="2" fill="#172554"/>
    <!-- Buttons down Manto -->
    <circle cx="61" cy="210" r="2" fill="#93c5fd"/>
    <circle cx="61" cy="225" r="2" fill="#93c5fd"/>
    <circle cx="61" cy="265" r="2" fill="#93c5fd"/>
    <circle cx="61" cy="285" r="2" fill="#93c5fd"/>
    <circle cx="61" cy="305" r="2" fill="#93c5fd"/>

    <!-- Head & Face -->
    <rect x="54" y="155" width="14" height="15" fill="#fde68a"/>
    <circle cx="61" cy="140" r="18" fill="#fed7aa"/>

    <!-- Black Maghnaeh (مقنعه مشکی دانشجویی) covering head, neck, and chest -->
    <!-- Maghnaeh chest drapery -->
    <polygon points="38,165 84,165 74,208 61,215 48,208" fill="#18181b"/>
    <!-- Maghnaeh head piece -->
    <path d="M 42 142 C 40 115, 82 115, 80 142 C 80 162, 76 175, 61 175 C 46 175, 42 162, 42 142 Z" fill="#18181b"/>
    
    <!-- Face opening in Maghnaeh -->
    <ellipse cx="61" cy="142" rx="11" ry="14" fill="#fed7aa"/>

    <!-- Strand of Hair subtly visible / peeking out from Maghnaeh front (کمی از موی او بیرون است) -->
    <path d="M 52 135 Q 58 131 66 134 Q 61 138 52 135 Z" fill="#3f2e1e"/>
    <path d="M 55 135 Q 52 142 56 145" fill="none" stroke="#291e13" stroke-width="1.8" stroke-linecap="round"/>

    <!-- Daughter's Face Features -->
    <!-- Eyes -->
    <circle cx="56" cy="142" r="1.8" fill="#1c1917"/>
    <circle cx="65" cy="142" r="1.8" fill="#1c1917"/>
    <!-- Happy Smile -->
    <path d="M 57 149 Q 61 153 65 149" fill="none" stroke="#e11d48" stroke-width="1.6" stroke-linecap="round"/>

    <!-- Right Arm holding the LAPTOP BAG (یک کیف لپتاپ در دست دختر دانشجو) -->
    <!-- Arm coming down holding handle -->
    <path d="M 78 185 Q 92 230 88 270" fill="none" stroke="url(#daughterManto)" stroke-width="11" stroke-linecap="round"/>
    <circle cx="88" cy="272" r="5" fill="#fed7aa"/>

    <!-- Laptop Bag (کیف لپتاپ شیک و حرفه‌ای) -->
    <g transform="translate(68, 275)" filter="url(#shadow4)">
      <!-- Bag Strap / Handle in Hand -->
      <path d="M 16 0 C 16 -12, 24 -12, 24 0" fill="none" stroke="#1e293b" stroke-width="3"/>
      <!-- Bag Body -->
      <rect x="0" y="0" width="52" height="42" rx="6" fill="url(#laptopBagGrad)" stroke="#1e293b" stroke-width="1.5"/>
      <!-- Front pocket & zipper -->
      <rect x="4" y="8" width="44" height="26" rx="4" fill="#1e293b" opacity="0.6"/>
      <line x1="8" y1="12" x2="44" y2="12" stroke="#64748b" stroke-width="1.5"/>
      <!-- Laptop logo on bag -->
      <circle cx="26" cy="22" r="5" fill="#38bdf8" opacity="0.8"/>
      <!-- Shoulder strap hanging down -->
      <path d="M 5 6 Q 0 35 12 48" fill="none" stroke="#1e293b" stroke-width="2"/>
    </g>

    <!-- Student Status Badge next to Daughter -->
    <g transform="translate(10, 80)">
      <rect x="0" y="0" width="115" height="24" rx="12" fill="#1e3a8a" stroke="#60a5fa" stroke-width="1" opacity="0.9"/>
      <text x="57" y="16" class="farsi" font-size="10" font-weight="700" fill="#dbeafe" text-anchor="middle">دانشجوی خریدار 🎓</text>
    </g>
  </g>

  <!-- Labels for the Characters at the Bottom -->
  <g transform="translate(50, 420)">
    <!-- Specialist Tag -->
    <rect x="40" y="0" width="110" height="24" rx="12" fill="#14532d" stroke="#22c55e" stroke-width="1"/>
    <text x="95" y="16" class="farsi" font-size="10" font-weight="700" fill="#86efac" text-anchor="middle">کارشناس فنی متخصص</text>

    <!-- Father Tag -->
    <rect x="250" y="0" width="100" height="24" rx="12" fill="#1e293b" stroke="#94a3b8" stroke-width="1"/>
    <text x="300" y="16" class="farsi" font-size="10" font-weight="700" fill="#f1f5f9" text-anchor="middle">پدر محترم دانشجو</text>

    <!-- Daughter Tag -->
    <rect x="420" y="0" width="110" height="24" rx="12" fill="#1e3a8a" stroke="#3b82f6" stroke-width="1"/>
    <text x="475" y="16" class="farsi" font-size="10" font-weight="700" fill="#bfdbfe" text-anchor="middle">دانشجو با کیف لپتاپ</text>
  </g>
</svg>
