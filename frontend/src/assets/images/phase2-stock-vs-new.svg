<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#082f49"/>
    </linearGradient>
    <linearGradient id="newGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="stockGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="boxCardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow2" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <style>
    .farsi { font-family: 'Vazirmatn', -apple-system, 'Segoe UI', Tahoma, sans-serif; direction: rtl; }
    .badge-farsi { font-family: 'Vazirmatn', -apple-system, sans-serif; font-size: 13px; font-weight: 800; fill: #ffffff; }
  </style>

  <!-- Background -->
  <rect width="600" height="450" rx="20" fill="url(#bgGrad2)"/>

  <!-- Top Header Banner -->
  <g transform="translate(150, 18)">
    <rect x="0" y="0" width="300" height="38" rx="19" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" opacity="0.95" filter="url(#shadow2)"/>
    <text x="150" y="24" class="farsi badge-farsi" text-anchor="middle" fill="#f8fafc">مقایسه تخصصی: لپتاپ نو در برابر استوک</text>
  </g>

  <!-- Split Divider in Center -->
  <line x1="300" y1="75" x2="300" y2="425" stroke="#334155" stroke-width="2" stroke-dasharray="6,6"/>
  
  <!-- VS Circle Badge in Center -->
  <g transform="translate(300, 240)">
    <circle cx="0" cy="0" r="26" fill="#0f172a" stroke="#0ea5e9" stroke-width="2.5" filter="url(#shadow2)"/>
    <text x="0" y="6" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="16" fill="#38bdf8" text-anchor="middle">VS</text>
  </g>

  <!-- ==============================================
       RIGHT HALF: لپتاپ در کارتن (لپتاپ نو آکبند)
       ============================================== -->
  <g transform="translate(320, 75)" id="new-laptop-section">
    <!-- Outer Card Container -->
    <rect x="0" y="0" width="260" height="345" rx="16" fill="#0f172a" stroke="#0284c7" stroke-width="1.5" opacity="0.9" filter="url(#shadow2)"/>

    <!-- Section Badge -->
    <g transform="translate(30, 16)">
      <rect x="0" y="0" width="200" height="32" rx="16" fill="url(#newGrad)"/>
      <text x="100" y="21" class="farsi badge-farsi" text-anchor="middle">📦 لپتاپ نو (آکبند و پلمپ)</text>
    </g>

    <!-- Laptop Box Illustration -->
    <g transform="translate(35, 68)">
      <!-- Box Shadow -->
      <ellipse cx="95" cy="150" rx="90" ry="14" fill="#000000" opacity="0.45"/>

      <!-- Carton Box 3D perspective -->
      <!-- Back flap -->
      <polygon points="40,25 150,25 165,5 55,5" fill="#a16207" opacity="0.8"/>
      <!-- Main front box body -->
      <rect x="15" y="45" width="160" height="95" rx="6" fill="#ca8a04" stroke="#78350f" stroke-width="2"/>
      <!-- Inner carton gradient -->
      <rect x="20" y="50" width="150" height="85" rx="4" fill="url(#boxGrad)" opacity="0.9"/>

      <!-- Top box opening revealing laptop wrapped in foam/protective sleeve -->
      <polygon points="15,45 40,20 185,20 160,45" fill="#fde047" opacity="0.4"/>
      <!-- The laptop partially inside the box -->
      <polygon points="35,28 165,28 150,55 20,55" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
      <polygon points="35,28 165,28 165,36 35,36" fill="#cbd5e1"/>
      <!-- Apple/Ultrabook slim edge peaking out -->
      <line x1="40" y1="36" x2="160" y2="36" stroke="#0284c7" stroke-width="2"/>
      
      <!-- Factory Packaging Tape / Seal -->
      <rect x="80" y="45" width="30" height="95" fill="#38bdf8" opacity="0.4"/>
      <line x1="95" y1="45" x2="95" y2="140" stroke="#0284c7" stroke-width="2"/>
      <!-- Box Branding Graphics -->
      <rect x="30" y="70" width="40" height="30" rx="3" fill="#78350f" opacity="0.4"/>
      <!-- Barcode on box -->
      <g transform="translate(125, 95)" opacity="0.8">
        <line x1="0" y1="0" x2="0" y2="25" stroke="#ffffff" stroke-width="2"/>
        <line x1="5" y1="0" x2="5" y2="25" stroke="#ffffff" stroke-width="1"/>
        <line x1="9" y1="0" x2="9" y2="25" stroke="#ffffff" stroke-width="3"/>
        <line x1="16" y1="0" x2="16" y2="25" stroke="#ffffff" stroke-width="1.5"/>
        <line x1="22" y1="0" x2="22" y2="25" stroke="#ffffff" stroke-width="2"/>
      </g>
      <!-- Fragile handle with care icon -->
      <circle cx="50" cy="85" r="10" fill="#fef08a" opacity="0.3"/>
      <text x="50" y="89" font-size="12" text-anchor="middle">🍷</text>
    </g>

    <!-- Feature Checklist -->
    <g transform="translate(15, 230)">
      <rect x="0" y="0" width="230" height="95" rx="10" fill="#1e293b" opacity="0.8"/>
      <!-- Item 1 -->
      <circle cx="215" cy="22" r="7" fill="#0284c7"/>
      <text x="215" y="26" font-size="9" fill="#ffffff" text-anchor="middle">✓</text>
      <text x="200" y="26" class="farsi" font-size="11" font-weight="600" fill="#e2e8f0" text-anchor="end">جعبه فابریک کارخانه و پلمپ</text>

      <!-- Item 2 -->
      <circle cx="215" cy="48" r="7" fill="#0284c7"/>
      <text x="215" y="52" font-size="9" fill="#ffffff" text-anchor="middle">✓</text>
      <text x="200" y="52" class="farsi" font-size="11" font-weight="600" fill="#e2e8f0" text-anchor="end">گارانتی ۱۸ تا ۲۴ ماهه شرکتی</text>

      <!-- Item 3 -->
      <circle cx="215" cy="74" r="7" fill="#0284c7"/>
      <text x="215" y="78" font-size="9" fill="#ffffff" text-anchor="middle">✓</text>
      <text x="200" y="78" class="farsi" font-size="11" font-weight="600" fill="#e2e8f0" text-anchor="end">طراحی مدرن و باتری ۱۰۰٪ صفر</text>
    </g>
  </g>

  <!-- ==============================================
       LEFT HALF: لپتاپ باز شده (استوک باکیفیت و تست شده)
       ============================================== -->
  <g transform="translate(20, 75)" id="stock-laptop-section">
    <!-- Outer Card Container -->
    <rect x="0" y="0" width="260" height="345" rx="16" fill="#0f172a" stroke="#059669" stroke-width="1.5" opacity="0.9" filter="url(#shadow2)"/>

    <!-- Section Badge -->
    <g transform="translate(30, 16)">
      <rect x="0" y="0" width="200" height="32" rx="16" fill="url(#stockGrad)"/>
      <text x="100" y="21" class="farsi badge-farsi" text-anchor="middle">💻 لپتاپ استوک (گرید A++)</text>
    </g>

    <!-- Opened Laptop Illustration -->
    <g transform="translate(45, 68)">
      <!-- Shadow under open laptop -->
      <ellipse cx="85" cy="148" rx="85" ry="12" fill="#000000" opacity="0.45"/>

      <!-- Laptop Screen (Open) -->
      <rect x="15" y="10" width="140" height="92" rx="6" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
      <rect x="20" y="15" width="130" height="82" rx="3" fill="url(#screenGrad)"/>

      <!-- Screen UI Content (Testing dashboard) -->
      <rect x="25" y="20" width="120" height="15" rx="2" fill="#0f172a" opacity="0.8"/>
      <text x="85" y="31" class="farsi" font-size="8" font-weight="700" fill="#34d399" text-anchor="middle">تست سلامت ۱۰۰٪ قطعات</text>
      
      <!-- Diagnostic Bars on Screen -->
      <text x="30" y="47" font-size="7" fill="#94a3b8">Battery Health: 92%</text>
      <rect x="30" y="50" width="110" height="4" rx="2" fill="#334155"/>
      <rect x="30" y="50" width="101" height="4" rx="2" fill="#10b981"/>

      <text x="30" y="65" font-size="7" fill="#94a3b8">SSD Health: 100% OK</text>
      <rect x="30" y="68" width="110" height="4" rx="2" fill="#334155"/>
      <rect x="30" y="68" width="110" height="4" rx="2" fill="#06b6d4"/>

      <!-- Grade A++ Seal Badge on screen corner -->
      <g transform="translate(112, 23)">
        <polygon points="12,0 24,8 20,22 4,22 0,8" fill="#f59e0b"/>
        <text x="12" y="16" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="8" fill="#0f172a" text-anchor="middle">A++</text>
      </g>

      <!-- Laptop Base / Keyboard (Opened) -->
      <polygon points="-5,102 175,102 190,132 -20,132" fill="#334155" stroke="#475569" stroke-width="1.5"/>
      <polygon points="5,104 165,104 178,126 -8,126" fill="#1e293b"/>
      <!-- Keys rows -->
      <rect x="15" y="107" width="140" height="3" rx="1" fill="#475569" opacity="0.8"/>
      <rect x="10" y="112" width="150" height="3" rx="1" fill="#475569" opacity="0.8"/>
      <rect x="5" y="117" width="160" height="3" rx="1" fill="#475569" opacity="0.8"/>
      <!-- Trackpad -->
      <rect x="70" y="122" width="30" height="8" rx="2" fill="#475569"/>
    </g>

    <!-- Feature Checklist -->
    <g transform="translate(15, 230)">
      <rect x="0" y="0" width="230" height="95" rx="10" fill="#1e293b" opacity="0.8"/>
      <!-- Item 1 -->
      <circle cx="215" cy="22" r="7" fill="#059669"/>
      <text x="215" y="26" font-size="9" fill="#ffffff" text-anchor="middle">✓</text>
      <text x="200" y="26" class="farsi" font-size="11" font-weight="600" fill="#e2e8f0" text-anchor="end">تا ۵۰٪ قیمت کمتر و مقرون‌به‌صرفه</text>

      <!-- Item 2 -->
      <circle cx="215" cy="48" r="7" fill="#059669"/>
      <text x="215" y="52" font-size="9" fill="#ffffff" text-anchor="middle">✓</text>
      <text x="200" y="52" class="farsi" font-size="11" font-weight="600" fill="#e2e8f0" text-anchor="end">سخت‌افزار قوی‌تر در همان بودجه</text>

      <!-- Item 3 -->
      <circle cx="215" cy="74" r="7" fill="#059669"/>
      <text x="215" y="78" font-size="9" fill="#ffffff" text-anchor="middle">✓</text>
      <text x="200" y="78" class="farsi" font-size="11" font-weight="600" fill="#e2e8f0" text-anchor="end">مهلت تست کامل و گارانتی سلامت</text>
    </g>
  </g>
</svg>
